name: Wenshan
options:
  bundleIdPrefix: im.wenshan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  WenshanHost:
    type: application
    platform: iOS
    sources:
      - path: WenshanHost
      - path: Shared
    info:
      path: WenshanHost/Info.plist
      properties:
        CFBundleDisplayName: 文山
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.wenshan.ios
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: WenshanHost/WenshanHost.entitlements
    dependencies:
      - target: WenshanKeyboard
        embed: true

  WenshanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WenshanUITests
    dependencies:
      - target: WenshanHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.wenshan.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WenshanHost

  WenshanKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: WenshanKeyboard
      - path: Shared
      - path: build/dict.bin
        buildPhase: resources
    info:
      path: WenshanKeyboard/Info.plist
      properties:
        CFBundleDisplayName: 文山
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.wenshan.ios.keyboard
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: WenshanKeyboard/WenshanKeyboard.entitlements
    dependencies:
      - framework: build/WenshanEngine.xcframework
        embed: false

schemes:
  WenshanHost:
    build:
      targets:
        WenshanHost: all
        WenshanUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WenshanUITests
  WenshanKeyboard:
    build:
      targets:
        WenshanKeyboard: all
    run:
      config: Debug
